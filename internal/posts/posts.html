<%= for (index, post) in posts { %>
    <div role="status" class="p-4 h-[406px] border border-gray-200 rounded shadow md:p-6 dark:border-gray-700">
        <div class="flex items-center justify-center mb-3">
            <img class="w-full h-52 rounded" src="/public/images/<%= post.FileName %>" alt="">
        </div>

        <h3 class="mb-2 font-semibold"><%= post.Title %></h3>
        <p class="text-sm text-gray-600"><%= post.Description %></p>

        <div class="flex items-center mt-4">
            <svg class="w-10 h-10 me-3 text-gray-200 dark:text-gray-700" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9 13h2a3.987 3.987 0 0 1 3.951 3.512A8.949 8.949 0 0 1 10 18Z"/>
            </svg>
            <div>
                <div class=" font-semibold"><%= post.AuthorName %></div>
                <div class="text-gray-600"><%= post.AuthorRole %></div>
            </div>
        </div>
    </div>
<% } %>
